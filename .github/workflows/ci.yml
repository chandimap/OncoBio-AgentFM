name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install canonical environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e ".[dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify canonical runtime
        run: python -m oncobio_agentfm.runtime

      - name: Lint
        run: ruff check .

      - name: Check source formatting
        run: ruff format --check .

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Test
        run: python -m pytest

      - name: Verify reviewed temporal protocol evidence
        run: python -m oncobio_agentfm.protocol_validation --check-report docs/evidence/temporal_validation.json

      - name: Record synthetic temporal validation
        run: python -m oncobio_agentfm.protocol_validation --output outputs/protocol-ci/temporal-validation.json

      - name: Upload synthetic protocol evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nsclc-protocol-synthetic-${{ matrix.os }}
          path: outputs/protocol-ci/temporal-validation.json
          if-no-files-found: error
          retention-days: 30
